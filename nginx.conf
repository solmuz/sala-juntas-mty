server {
    listen 80;
    server_name _;

    location /sala-juntas-mty/api.php {
        proxy_pass http://127.0.0.1:3000/api.php;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    location /sala-juntas-mty {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://alcdn.msauth.net https://login.microsoftonline.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com; frame-src https://login.microsoftonline.com;";
    }

    location /health {
        access_log off;
        return 200 "ok
";
        add_header Content-Type text/plain;
    }
}
